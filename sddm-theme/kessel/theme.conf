[General]
# Copied in by ~/Scripts/sddm-theme.sh install (SDDM cannot read your home).
background=background.png
accent=#8aadf4
# theme mode/colours (overwritten by sddm-theme.sh install from the desktop theme)
mode=dark
base=#000000
text=#e8e8e8
red=#e06c75
# true when /etc/pam.d/sddm has pam_fprintd (set by sddm-theme.sh install /
# scripts/fingerprint.sh): Enter on an empty password starts a fingerprint scan
fingerprint=false
