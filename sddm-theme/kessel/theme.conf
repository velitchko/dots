[General]
# Copied in by ~/Scripts/sddm-theme.sh install (SDDM cannot read your home).
background=background.png
# true = background is already blurred + darkened (sddm-theme.sh sync does this)
prerendered=false
accent=#8aadf4
# theme mode/colours (overwritten by sddm-theme.sh install from the desktop theme)
mode=dark
base=#000000
text=#e8e8e8
red=#e06c75
# true when /etc/pam.d/sddm has pam_fprintd (set by sddm-theme.sh install /
# scripts/fingerprint.sh): Enter on an empty password starts a fingerprint scan
fingerprint=false
# display that gets the login UI (output name or WxH, e.g. 2560x1440); the others
# show only the wallpaper. Empty = SDDM's primary. Set by sddm-theme.sh install.
screen=
