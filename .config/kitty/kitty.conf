# Kitty — the only terminal (also the Quickshell-independent fallback).
# Shared font sizes: mono 11 / UI 10 (see docs/THEME.md).

font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

window_padding_width   8
hide_window_decorations yes
confirm_os_window_close 0
enable_audio_bell       no
cursor_shape            beam
cursor_trail            1
scrollback_lines        10000
copy_on_select          clipboard
shell_integration       enabled
# Interactive shell: fish (the login shell is untouched; SUPER+SHIFT+Return opens plain bash)
shell                   fish

# Colours: generated by ~/.config/hypr/scripts/theme.sh (dark = pitch black,
# light = eggshell, accents from the wallpaper). theme.sh pushes new colours to
# running kittys over a private socket in $XDG_RUNTIME_DIR (owner-only, 0700) —
# never an abstract @socket, which other local users could reach.
allow_remote_control    socket-only
listen_on               unix:${XDG_RUNTIME_DIR}/kitty-{kitty_pid}.sock
background_opacity 0.96
include ~/.local/state/kessel/theme/kitty.conf
